name: fastgs
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip=24.0
  - pytorch=2.1.2
  - torchvision=0.16.2
  - torchaudio=2.1.2
  - pytorch-cuda=11.8
  - plyfile
  - tqdm
  - websockets
  - pip:
    - -e submodules/diff-gaussian-rasterization_fastgs
    - -e submodules/simple-knn
    - -e submodules/fused-ssim
